<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Creá tu cuenta en NullPod para comprar videojuegos digitales y dejar reseñas.">
    <meta name="author" content="Demian Denegri">
    <title>Crear cuenta — NullPod</title>
    <!-- Tipografías -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Audiowide&family=Press+Start+2P&display=swap" rel="stylesheet">
    <!-- Tipografías -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/register.css">
</head>

<body>

     <!-- ============ HEADER ============ -->
     <!-- ============ 1. NAVBAR DE NAVEGACIÓN ============ -->
    <header class="navbar">
        <nav aria-label="Navegación principal">
            <a href="index.html" class="logo" aria-label="NullPod, página de inicio">
                <img src="img/pod-logo.png" alt="Logo de NullPod">
            </a>

            <!-- Barra de búsqueda -->
            <form action="#" method="get" role="search" aria-label="Búsqueda de juegos" class="navbar-search">
                <input type="search" id="busqueda" name="q" placeholder="Buscá un título…" autocomplete="off">
            </form>

            <ul class="navbar-icons">
                <li>
                    <a href="#" aria-label="Abrir carrito de compras">
                        <!-- logo carrito -->
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <circle cx="9" cy="21" r="1"></circle>
                            <circle cx="20" cy="21" r="1"></circle>
                            <path d="M1 1h4l2.6 13.4a2 2 0 0 0 2 1.6h9.8a2 2 0 0 0 2-1.6L23 6H6"></path>
                        </svg>
                        <!-- logo carrito -->
                    </a>
                </li>
                <li>
                    <a href="#" aria-label="Ir a mi biblioteca">
                        <!-- logo biblioteca -->
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                        </svg>
                        <!-- logo biblioteca -->
                        <span>Mi biblioteca</span>
                    </a>
                </li>
            </ul>

            <!-- Menú hamburguesa: contiene login + botón crear cuenta (solo HTML semántico) -->
            <details id="acceso" class="menu-cuenta" aria-label="Menú de cuenta">
                <summary aria-label="Abrir menú de cuenta" aria-haspopup="menu">
                    &#9776; Cuenta
                </summary>

                <section aria-labelledby="titulo-menu-cuenta">
                    
                    <!-- Opciones de ingreso -->
                    <form action="#" method="post" aria-labelledby="titulo-menu-cuenta">
                        <fieldset>

                            <label for="log-email">Correo electrónico</label>
                            <input type="email" id="log-email" name="email" required
                                placeholder="tucorreo@ejemplo.com">

                            <label for="log-clave">Contraseña</label>
                            <input type="password" id="log-clave" name="clave" required>

                            <button type="submit">Ingresar</button>
                        </fieldset>
                    </form>

                    <!-- Botón crear cuenta dentro del mismo menú hamburguesa -->
                    <section aria-labelledby="titulo-sin-cuenta-nav">
                        <h3 id="titulo-sin-cuenta-nav">¿No tenés cuenta?</h3>
                        
                        <form action="register.html" method="get" aria-label="Ir a registro">
                            <button type="submit">Crear una cuenta</button>
                        </form>
                    </section>
                </section>
            </details>
        </nav>
    </header>
    <main>


        <section class="registro" aria-labelledby="titulo-registro">
            <h1 id="titulo-registro">Crear cuenta</h1>

            <form class="registro-forma" action="#" method="post" aria-labelledby="titulo-registro">
                <fieldset>
                    <label for="reg-nombre">Nombre de usuario</label>
                    <input type="text" id="reg-nombre" name="usuario" required minlength="3"
                        placeholder="Elegí tu nombre de usuario">

                    <label for="reg-email">Correo electrónico</label>
                    <input type="email" id="reg-email" name="email" required placeholder="tucorreo@ejemplo.com">

                    <label for="reg-clave">Contraseña</label>
                    <input type="password" id="reg-clave" name="clave" required minlength="8"
                        placeholder="Mínimo 8 caracteres">

                    <label for="reg-clave2">Confirmar contraseña</label>
                    <input type="password" id="reg-clave2" name="clave2" required placeholder="Repetí tu contraseña">

                    <button type="submit">Crear cuenta</button>
                </fieldset>
            </form>

            <!-- Iniciar sesión: el login está en index.html -->
            <form action="index.html" method="get" aria-label="Ir a iniciar sesión">
                <button type="submit" class="boton-secundario">Iniciar sesión</button>
            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 NullPod. Todos los derechos reservados.</p>
        <nav aria-label="Enlaces del pie de página">
            <a href="#">Términos y condiciones</a>
            <a href="#">Política de privacidad</a>
            <a href="#">Contacto</a>
        </nav>
    </footer>

</body>

</html>
